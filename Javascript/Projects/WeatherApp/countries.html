<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country</title>
    <link rel="stylesheet" href="./styles/countries.css">
</head>
<body>
    <header id="goBack">
        Go Back
    </header>
    <h1 class="title">Countries</h1>
    <div id="flag-container">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Flag_of_the_United_States.svg/1280px-Flag_of_the_United_States.svg.png" alt="" id="flag">
    </div>
    <div class="country-name">
        USA
    </div>
    <div class="capital">
        Washington DC
    </div>
    <div class="region-container">
        <div class="region">Americas</div>
        <div class="sub-region">North America</div>
    </div>
    <div class="population">99828929292</div>
    <div class="continent">North America</div>
    <div class="location">
        <a class="google-location" target="_blank">Google Maps</a>
        <a href="" class="openmaps-location" target="_blank">OpenStreet Maps</a>
    </div>
    <div class="coat-of-arms-container">
        <img class="coat-of-arms" src="https://mainfacts.com/media/images/coats_of_arms/us.png" alt="">
    </div>
    <div class="borders">
        <div class='border-title'>Borders</div>
        <div class='border-container'></div>
    </div>
</body>
<script src="./scripts/Countries.js"></script>
</html>
