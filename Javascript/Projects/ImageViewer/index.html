<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image viewer</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
    <div>
        <select name="imageCategory" id="category">
            <option value="">Select snake</option>
            <option value="king cobra">King Cobra</option>
            <option value="python">Python</option>
            <option value="Boa">Boa</option>
            <option value="anaconda">Anaconda</option>
        </select>
        <button id="showButton">show</button>
        <button class="hide" id="hideButton">hide</button>
    </div>
    <div class="imageContainer">
        <img src="./assets/anaconda.jpg" alt="">
    </div>
</body>
<script src="./scripts/index.js"></script>
</html>
