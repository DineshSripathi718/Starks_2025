<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>view contact</title>
    <link rel="stylesheet" href="./styles/header.css">
    <link rel="stylesheet" href="./styles/viewContact.css">
</head>
<body>
    <header>
        <div class="title">Contact Management System</div>
        <nav class="navbar-container">
            <div class="navbar-item">
                <a href="./index.html" class="nav-link">Home</a>
            </div>
            <div class="navbar-item">
                <a href="./login.html" class="nav-link">Login</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="view-contact-container">
            <div class="image-container">
                <img src="./assets/images/test-user1.jpg" alt="Contact Image">
            </div>
            <div class="contact-name">Drew Grek</div>
            <div class="contact-email">drew.grek@example.com</div>
            <div class="contact-phone">+1 234 567 890</div>

            <div class="tags-container">
                <div class="tag">Friends</div>
                <div class="tag">Company</div>
            </div>

            <div class="button-container">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
                <button class="back-btn" onclick="window.history.back()">Back</button>
            </div>
        </div>
    </main>

    <footer></footer>
</body>
</html>
