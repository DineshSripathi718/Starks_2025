<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color box</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body onkeypress="KeyboardEvent(event);">
    <div class="buttons-container">
        <button onclick="redColorHandler(event);">red</button>
        <button onclick="greenColorHandler();">green</button>
        <button onclick="yellowColorHandler();">yellow</button>
        <button onclick="clearHandler();">clear</button>
    </div>
    <div class="box">
        press a button to change my color
    </div>
</body>
<script src="./scripts/index.js"></script>
</html>
