<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOR BOX</title>
    <link rel="stylesheet" href="./style/index.css">
</head>
<body onkeypress="KeyboardEvent(event)">
    <div class="box-container">
        <button onclick="redColorHandler(event);">red</button>
        <button onclick="blueColorHandler(event);">blue</button>
        <button onclick="yellowColorHandler(event);">yellow</button>

    </div>
    
    
    <div class="box">
    </div>

    <div class="clear"></div>
</body>
<script src="script.js"></script>
</html>
